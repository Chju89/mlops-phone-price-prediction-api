replicaCount: 1

image:
  repository: us-central1-docker.pkg.dev/mle-course-454508/mlops-repo/phone-price-api-fastapi
  pullPolicy: Always
  tag: v4

containerPort: 8000  # 👈 Rất quan trọng để tránh lỗi containerPort=0

service:
  type: LoadBalancer
  port: 80
  targetPort: 8000
  selectorLabels:
    app.kubernetes.io/instance: fastapi  # 👈 phục vụ cho ServiceMonitor

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

env:
  - name: MLFLOW_TRACKING_URI
    value: http://mlflow-mlflow.default.svc.cluster.local:5000
  - name: MLFLOW_ARTIFACT_URI
    value: gs://mle-course-454508-mlflow-bucket/mlflow

serviceMonitor:
  enabled: true

