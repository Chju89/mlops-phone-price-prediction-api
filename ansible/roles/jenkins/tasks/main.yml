---
- name: Install Java (Jenkins dependency)
  apt:
    name: openjdk-17-jdk
    state: present
    update_cache: yes

- name: Ensure /etc/apt/keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

# Cleanup Jenkins config (phòng lỗi trùng repo/key)
- name: Remove legacy Jenkins repo (if exists)
  file:
    path: /etc/apt/sources.list.d/jenkins.list
    state: absent

- name: Remove legacy Jenkins GPG key (if exists)
  file:
    path: /usr/share/keyrings/jenkins-keyring.asc
    state: absent

# Tải GPG key chính thức
- name: Download Jenkins GPG key and convert to GPG format
  shell: |
    curl -fsSL https://pkg.jenkins.io/debian-stable/jenkins.io.key | gpg --dearmor -o /etc/apt/keyrings/jenkins.gpg
  args:
    creates: /etc/apt/keyrings/jenkins.gpg

# Thêm repo Jenkins dùng signed-by chuẩn
- name: Add Jenkins APT repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/jenkins.gpg] https://pkg.jenkins.io/debian-stable binary/"
    filename: jenkins
    state: present

- name: Update APT cache
  apt:
    update_cache: yes

- name: Install Jenkins
  apt:
    name: jenkins
    state: latest

- name: Enable and start Jenkins service
  systemd:
    name: jenkins
    enabled: yes
    state: started

---

- name: Cập nhật apt cache
  apt:
    update_cache: yes

- name: Cài pip3
  apt:
    name: python3-pip
    state: present

- name: Cài công cụ lint/test Python
  pip:
    name:
      - black
      - ruff
      - pytest
    executable: pip3

- name: Cài kubectl
  shell: |
    curl -LO "https://storage.googleapis.com/kubernetes-release/release/$(curl -s https://storage.googleapis.com/kubernetes-release/release/stable.txt)/bin/linux/amd64/kubectl"
    chmod +x kubectl
    mv kubectl /usr/local/bin/kubectl
  args:
    creates: /usr/local/bin/kubectl

- name: Cài Helm
  shell: |
    curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: /usr/local/bin/helm

